name: SPT installer build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-incremental --no-restore

      - name: Publish Linux build
        run: |
          dotnet publish SPTInstaller/SPTInstaller.csproj -c Release -r linux-x64             -p:PublishSingleFile=true --self-contained true -o ./publish-linux

          chmod +x ./publish-linux/SPTInstaller
          tar -czf SPTInstaller-linux-x64.tar.gz -C ./publish-linux SPTInstaller

      # Artifacts are zipped without file modes, the tarball keeps the exec bit
      - uses: actions/upload-artifact@v4
        with:
          name: SPTInstaller-linux-x64
          path: SPTInstaller-linux-x64.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://patcher.sp-tushonka.com/installer.json

    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"

          if ! printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Tag $GITHUB_REF_NAME is not a version the assembly can carry" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: |
          dotnet publish SPTInstaller/SPTInstaller.csproj -c Release -r win-x64 \
            -p:PublishSingleFile=true -p:CETCompat=false --self-contained true \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }} \
            -p:InformationalVersion=${{ steps.version.outputs.version }} \
            -o ./publish

          dotnet publish SPTInstaller/SPTInstaller.csproj -c Release -r linux-x64 \
            -p:PublishSingleFile=true --self-contained true \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }} \
            -p:InformationalVersion=${{ steps.version.outputs.version }} \
            -o ./publish-linux

          chmod +x ./publish-linux/SPTInstaller
          cp -p ./publish-linux/SPTInstaller ./publish/SPTInstaller

          # A download loses the exec bit, the tarball keeps it for people grabbing the release by hand
          tar -czf ./publish/SPTInstaller-linux-x64.tar.gz -C ./publish SPTInstaller

      - name: Collect release notes
        run: |
          git fetch --force --tags origin

          if [ "$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null)" = "tag" ]; then
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' \
              | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > "$RUNNER_TEMP/notes.txt"
          fi

          if [ ! -s "$RUNNER_TEMP/notes.txt" ]; then
            previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            git log --no-merges --pretty=format:%s "${previous_tag:+$previous_tag..}${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.txt"
          fi

          sed -i -e 's/^[-*][[:space:]]*//' -e '/^[[:space:]]*$/d' "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/notes.txt"

      - name: Write installer manifest
        run: |
          sha256=$(sha256sum ./publish/SPTInstaller.exe | cut -d ' ' -f 1)
          sha256_linux=$(sha256sum ./publish/SPTInstaller | cut -d ' ' -f 1)

          jq -R . "$RUNNER_TEMP/notes.txt" \
            | jq -s --arg version "${{ steps.version.outputs.version }}" --arg sha256 "$sha256" --arg sha256_linux "$sha256_linux" \
                '{ LatestVersion: $version, Changes: ., Sha256: $sha256, Sha256Linux: $sha256_linux }' > ./publish/installer.json

          cat ./publish/installer.json

      - name: Upload to mirrors
        env:
          # One mirror per line as "host web-root", all reached with the same user and key
          MIRRORS: ${{ vars.MIRRORS }}
          MIRROR_USER: ${{ secrets.MIRROR_USER }}
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          if [ -z "$MIRRORS" ]; then
            echo "No mirror configured, skipping."
            exit 0
          fi

          key="$RUNNER_TEMP/mirror_key"

          install -m 600 /dev/null "$key"
          printf '%s\n' "$MIRROR_SSH_KEY" > "$key"

          upload() {
          sftp -b - -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$MIRROR_USER@$1" <<SFTP
          put ./publish/SPTInstaller.exe $2/SPTInstaller.exe.part
          rename $2/SPTInstaller.exe.part $2/SPTInstaller.exe
          put ./publish/SPTInstaller $2/SPTInstaller.part
          rename $2/SPTInstaller.part $2/SPTInstaller
          put ./publish/installer.json $2/installer.json.part
          rename $2/installer.json.part $2/installer.json
          SFTP
          }

          failed=0

          while read -r host root; do
            if [ -n "$host" ] && ! upload "$host" "$root"; then
              echo "::error::Could not upload to $host"
              failed=1
            fi
          # Variables edited in the browser are saved with CRLF line endings
          done <<< "${MIRRORS//$'\r'/}"

          exit $failed

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp ./publish/SPTInstaller.exe "s3://${{ secrets.R2_BUCKET }}/SPTInstaller.exe" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=300"

          aws s3 cp ./publish/SPTInstaller "s3://${{ secrets.R2_BUCKET }}/SPTInstaller" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=300"

          # Short lived so a release is picked up promptly. The installer caches it for an hour locally anyway.
          aws s3 cp ./publish/installer.json "s3://${{ secrets.R2_BUCKET }}/installer.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=300"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes-file "$RUNNER_TEMP/notes.txt"
            gh release upload "${{ github.ref_name }}" ./publish/SPTInstaller.exe ./publish/SPTInstaller ./publish/SPTInstaller-linux-x64.tar.gz --clobber
          else
            gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes-file "$RUNNER_TEMP/notes.txt" --target ${{ github.sha }} ./publish/SPTInstaller.exe ./publish/SPTInstaller ./publish/SPTInstaller-linux-x64.tar.gz
          fi
