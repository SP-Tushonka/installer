name: SPT installer build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-incremental --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --no-restore

      - name: Publish Linux installer
        run: |
          dotnet publish SPTInstaller/SPTInstaller.csproj -c Release -r linux-x64 \
            -p:PublishSingleFile=true --self-contained true \
            -o ./publish/linux

      - name: Upload Linux installer
        uses: actions/upload-artifact@v7
        with:
          name: SPTInstaller-linux-x64
          path: ./publish/linux/SPTInstaller.Linux
          if-no-files-found: error

  linux-smoke:
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libx11-6 libice6 libsm6 libfontconfig1 libicu74 xvfb
          - name: debian-13
            image: debian:13-slim
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libx11-6 libice6 libsm6 libfontconfig1 libicu76 xvfb
          - name: fedora-44
            image: fedora:44
            install: dnf install -y libX11 libICE libSM fontconfig libicu xorg-x11-server-Xvfb
          - name: arch
            image: archlinux:base
            install: pacman -Syu --noconfirm libx11 libice libsm fontconfig icu xorg-server-xvfb

    steps:
      - name: Install ${{ matrix.name }} runtime dependencies
        run: ${{ matrix.install }}

      - name: Download Linux installer
        uses: actions/download-artifact@v8
        with:
          name: SPTInstaller-linux-x64
          path: ./publish/linux

      - name: Initialize Avalonia on ${{ matrix.name }}
        run: |
          chmod +x ./publish/linux/SPTInstaller.Linux
          Xvfb :99 -screen 0 1024x768x24 &
          xvfb_pid=$!
          sleep 1
          DISPLAY=:99 ./publish/linux/SPTInstaller.Linux --platform-smoke-test
          kill "$xvfb_pid"

  release:
    needs:
      - build
      - linux-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://patcher.sp-tushonka.com/installer.json

    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"

          if ! printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Tag $GITHUB_REF_NAME is not a version the assembly can carry" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish Windows installer
        run: |
          dotnet publish SPTInstaller/SPTInstaller.csproj -c Release -r win-x64 \
            -p:PublishSingleFile=true -p:PublishReadyToRun=true --self-contained true \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }} \
            -p:InformationalVersion=${{ steps.version.outputs.version }} \
            -o ./publish/windows

      - name: Publish Linux installer
        run: |
          dotnet publish SPTInstaller/SPTInstaller.csproj -c Release -r linux-x64 \
            -p:PublishSingleFile=true -p:PublishReadyToRun=true --self-contained true \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }} \
            -p:InformationalVersion=${{ steps.version.outputs.version }} \
            -o ./publish/linux

      - name: Collect release notes
        run: |
          git fetch --force --tags origin

          if [ "$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null)" = "tag" ]; then
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' \
              | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > "$RUNNER_TEMP/notes.txt"
          fi

          if [ ! -s "$RUNNER_TEMP/notes.txt" ]; then
            previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            git log --no-merges --pretty=format:%s "${previous_tag:+$previous_tag..}${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.txt"
          fi

          sed -i -e 's/^[-*][[:space:]]*//' -e '/^[[:space:]]*$/d' "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/notes.txt"

      - name: Write installer manifest
        run: |
          jq -R . "$RUNNER_TEMP/notes.txt" \
            | jq -s --arg version "${{ steps.version.outputs.version }}" \
                '{ LatestVersion: $version, Changes: . }' > ./publish/installer.json

          cat ./publish/installer.json

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp ./publish/windows/SPTInstaller.exe "s3://${{ secrets.R2_BUCKET }}/SPTInstaller.exe" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=300"

          aws s3 cp ./publish/linux/SPTInstaller.Linux "s3://${{ secrets.R2_BUCKET }}/SPTInstaller.Linux" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=300"

          # Short lived so a release is picked up promptly. The installer caches it for an hour locally anyway.
          aws s3 cp ./publish/installer.json "s3://${{ secrets.R2_BUCKET }}/installer.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=300"

      - name: Upload to mirror
        env:
          MIRROR_HOST: ${{ secrets.MIRROR_HOST }}
          MIRROR_USER: ${{ secrets.MIRROR_USER }}
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_ROOT: ${{ vars.MIRROR_ROOT || '/var/www/mirror.sp-tushonka.com' }}
        run: |
          if [ -z "$MIRROR_HOST" ]; then
            echo "No mirror configured, skipping."
            exit 0
          fi

          key="$RUNNER_TEMP/mirror_key"

          install -m 600 /dev/null "$key"
          printf '%s\n' "$MIRROR_SSH_KEY" > "$key"

          sftp -b - -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$MIRROR_USER@$MIRROR_HOST" <<SFTP
          put ./publish/windows/SPTInstaller.exe $MIRROR_ROOT/SPTInstaller.exe.part
          rename $MIRROR_ROOT/SPTInstaller.exe.part $MIRROR_ROOT/SPTInstaller.exe
          put ./publish/linux/SPTInstaller.Linux $MIRROR_ROOT/SPTInstaller.Linux.part
          rename $MIRROR_ROOT/SPTInstaller.Linux.part $MIRROR_ROOT/SPTInstaller.Linux
          put ./publish/installer.json $MIRROR_ROOT/installer.json.part
          rename $MIRROR_ROOT/installer.json.part $MIRROR_ROOT/installer.json
          SFTP

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes-file "$RUNNER_TEMP/notes.txt"
            gh release upload "${{ github.ref_name }}" ./publish/windows/SPTInstaller.exe ./publish/linux/SPTInstaller.Linux --clobber
          else
            gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --notes-file "$RUNNER_TEMP/notes.txt" --target ${{ github.sha }} ./publish/windows/SPTInstaller.exe ./publish/linux/SPTInstaller.Linux
          fi
